name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `features: tls` is what gives the shipped binary a TCP+mTLS ingest
          # listener. Without it the build is Unix-socket-only, which is NOT what
          # the docs describe — every release before 2.0.3 shipped that way.
          #
          # Unix only, and that is now deliberate. Releases up to and including v2.0.4 also
          # carried weir-server-x86_64-pc-windows-msvc.exe, a binary that could
          # not accept a record by any route: `mod socket` is `#[cfg(unix)]`, the
          # TCP+mTLS listener is `#[cfg(all(unix, feature = "tls"))]`, and the
          # `#[cfg(not(unix))]` arm of main.rs simply awaits shutdown. It was also
          # the only target with no smoke test, because the smoke test asserts the
          # binary was built WITH tls — which on Windows it cannot be.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            features: tls
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            features: tls
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            features: tls
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            features: tls
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          FEATURES=""
          if [ -n "${{ matrix.features }}" ]; then
            FEATURES="--features ${{ matrix.features }}"
          fi
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p weir-server $FEATURES
          else
            cargo build --release --target ${{ matrix.target }} -p weir-server $FEATURES
          fi
      # A1 regression guard. Proves the binary that is about to be uploaded
      # actually has the TCP+mTLS listener compiled in. It needs no certificates:
      # a tls-less build is rejected by config validation with a DIFFERENT
      # message ("built without the 'tls' feature") than a tls build ("tls_cert_path
      # is required"), so the startup error alone distinguishes them. Runs only on
      # targets this runner can execute natively.
      - name: Verify the shipped binary has a TLS listener
        if: matrix.smoke
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/weir-server"
          WAB="$(mktemp -d)"
          set +e
          OUT="$("$BIN" --tcp-bind 127.0.0.1:17100 --wab-dir "$WAB" 2>&1)"
          set -e
          echo "$OUT"
          if printf '%s' "$OUT" | grep -q "without the 'tls' feature"; then
            echo "::error::weir-server was built WITHOUT --features tls; this artifact would ship with no network ingest listener."
            exit 1
          fi
          echo "OK: binary accepts tcp_bind and fails on the missing cert, as a tls build should."
      - name: Stage binary
        shell: bash
        run: mv target/${{ matrix.target }}/release/weir-server weir-server-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: weir-server-${{ matrix.target }}
          path: weir-server-${{ matrix.target }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
