name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # Lint the feature matrix: default, all-features (clickhouse + tls), and
      # no-default-features (noop-only). Feature-gating regressions and lints in
      # otherwise-uncompiled code (clickhouse/tls) now fail CI (S08).
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      # The demo banners show the weir version via demo/version.js (single source,
      # generated from [workspace.package] in Cargo.toml). Fail if it drifts — after
      # a version bump, run scripts/sync-demo-version.sh and commit demo/version.js.
      - run: ./scripts/sync-demo-version.sh && git diff --exit-code demo/version.js

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The declared MSRV (workspace.package.rust-version). This job is what makes
      # the floor real: a dependency or syntax bump that needs a newer compiler
      # fails here instead of silently raising the requirement (escalation #15).
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --locked

  advisories:
    name: advisories (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  conformance:
    name: conformance (wire vectors + polyglot clients)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: ">=22.6" }
      # The Rust decoder is already covered by crates/weir-core/tests/conformance.rs
      # in the `test` job. What had NO coverage were the five from-spec clients —
      # which is how the Sync -> Durable durability-tier rename in
      # docs/conformance/wire_v1_vectors.json broke all five of them (reported as
      # only three; verifying rather than assuming caught that Java and TypeScript
      # were broken too) and shipped in 2.0.0 unnoticed. C and Go need no extra
      # setup: ubuntu-latest ships a C toolchain and `make`, and the Go client has
      # no external deps.
      - run: python3 docs/conformance/run_vectors.py
      - run: python3 demos/py-wire-client/tests/test_conformance.py
      - run: cd demos/go-wire-client && go test ./...
      - run: cd demos/c-wire-client && make check
      - name: Java demo client conformance
        run: |
          cd demos/java-wire-client
          javac -d out $(find src -name '*.java')
          java -cp out dev.weir.client.ConformanceRunner ../../docs/conformance/wire_v1_vectors.json
      - name: TypeScript demo client conformance
        run: cd demos/ts-wire-client && node src/conformance.ts

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # weir-server's bin unit tests run serially: socket::bind_hardened mutates
      # the process-global umask around bind(2), so a directory created by
      # another thread in that window loses its execute bit (~66 spurious
      # PermissionDenied failures). See docs/security/socket-bind.md.
      - run: cargo test --workspace --exclude weir-server
      - run: cargo test -p weir-server --lib --test system --test load --test load_tls --test tls_client --test tls_listener
      - run: cargo test -p weir-server --bins -- --test-threads=1
      # Build + run the clickhouse-sink and tls test code, which the default
      # feature set never compiles (S08). --all-features pulls in both.
      - run: cargo test --workspace --exclude weir-server --all-features
      - run: cargo test -p weir-server --lib --test system --test load --test load_tls --test tls_client --test tls_listener --all-features
      - run: cargo test -p weir-server --bins --all-features -- --test-threads=1

  dst:
    name: dst (sim sweep)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds the WAB deterministic-simulation harness with the `dst` feature
      # ON (compile-checks the non-test path too), replays every pinned
      # regression seed in tests/dst_seeds/, and runs a deeper random-seed
      # sweep than the default `cargo test` (300 seeds × 5 fault scenarios).
      # A violated durability invariant fails here with a WEIR_DST_SEED repro.
      - name: DST scenarios + regression seeds + sweep
        env:
          WEIR_DST_SWEEP: "300"
        run: cargo test -p weir-server --bin weir-server --features dst "wab::dst::" -- --test-threads=1

  monitoring:
    name: monitoring (observability e2e)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # Brings up the full docker-compose stack (weir + Prometheus + Grafana +
      # loadgen), simulates load, and asserts the metrics advance, the
      # durability/health invariants hold, and the dashboard's panel queries
      # return data through Grafana's datasource proxy. Validates the dashboard,
      # alert rules, and the image build end to end.
      - name: Monitoring stack smoke test
        run: deploy/monitoring/smoke-test.sh --teardown

  load:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build test binary
        run: cargo test -p weir-server --test load --no-run
      - name: Run load tests (5 × 1ms deadline, 5 × 2ms deadline)
        run: |
          for deadline in 1 2; do
            for i in 1 2 3 4 5; do
              echo "--- deadline=${deadline}ms run $i ---"
              WEIR_BENCH_DEADLINE=$deadline \
                cargo test -p weir-server --test load --release -- --nocapture 2>/dev/null \
                | grep '^BENCH: ' >> load_results.jsonl || true
            done
          done
      - name: Extract version
        run: |
          echo "WEIR_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')" >> "$GITHUB_ENV"
      - name: Average results and update benchmarks
        run: |
          python3 deploy/avg_benchmarks.py \
            load_results.jsonl \
            docs/benchmarks/latest.md \
            docs/benchmarks/history.md
      - name: Show benchmark summary
        run: cat docs/benchmarks/latest.md
      - name: Commit benchmark results
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmarks/latest.md docs/benchmarks/history.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: update benchmark baselines [skip ci]"
            git push
          fi

  bench:
    name: bench (tests/load)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run bench (tests/load)
        # tests/load.rs spawns its own weir-server, runs every benchmark
        # scenario, and emits the same `BENCH:` JSONL format that
        # avg_benchmarks.py consumes — so the renderer below is unchanged.
        # Three trials per deadline to average out single-run noise.
        run: |
          set -euo pipefail
          for run in 1 2 3; do
            echo "--- bench run $run ---"
            WEIR_BENCH_DEADLINE=1 \
              cargo test --release -p weir-server --test load -- --nocapture 2>/dev/null \
              | grep '^BENCH: ' \
              >> bench_results.jsonl
          done

      - name: Show bench results
        run: |
          echo "=== raw BENCH lines ==="
          grep '^BENCH: ' bench_results.jsonl || true

      - name: Average results
        run: |
          python3 deploy/avg_benchmarks.py \
            bench_results.jsonl \
            docs/benchmarks/bench-latest.md
          cat docs/benchmarks/bench-latest.md

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # `features: tls` is what gives the shipped binary a TCP+mTLS ingest
          # listener. Without it the build is Unix-socket-only, which is NOT what
          # the docs describe — every release before 2.0.3 shipped that way.
          # Windows is the exception on purpose: the listener layer is
          # `#[cfg(unix)]`, so there is nothing for `tls` to switch on there.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            features: tls
            smoke: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            features: tls
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            features: tls
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            features: tls
            smoke: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Windows tar.exe intermittently fails to save the cache; skip the
          # post-run save step to prevent a flaky infrastructure error from
          # failing the build job.
          save-if: ${{ matrix.os != 'windows-latest' }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          FEATURES=""
          if [ -n "${{ matrix.features }}" ]; then
            FEATURES="--features ${{ matrix.features }}"
          fi
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p weir-server $FEATURES
          else
            cargo build --release --target ${{ matrix.target }} -p weir-server $FEATURES
          fi
      # A4 proof. The TCP+mTLS client must build on EVERY target, Windows
      # included. It was gated `#[cfg(all(unix, feature = "tls"))]` purely
      # because it imported two types that happened to live in the Unix module;
      # `tls.rs` itself uses TcpStream and rustls and nothing else. Building it
      # here is what turns that from a claim into a fact — the previous gate was
      # never questioned precisely because nothing ever tried.
      - name: Build the mTLS client on every target
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p weir-client --features tls
          else
            cargo build --release --target ${{ matrix.target }} -p weir-client --features tls
          fi

      # A1 regression guard. Proves the binary that is about to be uploaded
      # actually has the TCP+mTLS listener compiled in. It needs no certificates:
      # a tls-less build is rejected by config validation with a DIFFERENT
      # message ("built without the 'tls' feature") than a tls build ("tls_cert_path
      # is required"), so the startup error alone distinguishes them. Runs only on
      # targets this runner can execute natively.
      - name: Verify the shipped binary has a TLS listener
        if: matrix.smoke
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/weir-server"
          WAB="$(mktemp -d)"
          set +e
          OUT="$("$BIN" --tcp-bind 127.0.0.1:17100 --wab-dir "$WAB" 2>&1)"
          set -e
          echo "$OUT"
          if printf '%s' "$OUT" | grep -q "without the 'tls' feature"; then
            echo "::error::weir-server was built WITHOUT --features tls; this artifact would ship with no network ingest listener."
            exit 1
          fi
          echo "OK: binary accepts tcp_bind and fails on the missing cert, as a tls build should."
      - name: Stage binary (Unix)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: mv target/${{ matrix.target }}/release/weir-server weir-server-${{ matrix.target }}
      - name: Stage binary (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: mv target/${{ matrix.target }}/release/weir-server.exe weir-server-${{ matrix.target }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: weir-server-${{ matrix.target }}
          path: weir-server-${{ matrix.target }}*
          retention-days: 7
