# docker-compose for sink integration tests.
#
# Brings up MySQL and PostgreSQL with pre-seeded `weir_records` schemas
# matching the reference schemas in `docs/operations/configuration.md`.
# Used by `scripts/run-sink-integration-tests.sh` to back the
# `--ignored` `*_sink_end_to_end` tests in `tests/system.rs`.
#
# Deliberately separate from `deploy/docker/docker-compose.yml` (which is
# the deployment EXAMPLE, not a test rig): different lifecycle, different
# port choices (127.0.0.1-only), different schema-init expectations.
#
# Bring up:
#   docker compose -f deploy/docker/test/docker-compose.yml up -d
# Bring down:
#   docker compose -f deploy/docker/test/docker-compose.yml down -v
#
# Healthchecks are configured so the runner script can wait for both
# services to be ready before exporting the env vars and running the
# tests — see scripts/run-sink-integration-tests.sh for the wait logic.

services:
  mysql:
    image: mysql:8.0
    container_name: weir-test-mysql
    # 127.0.0.1-only so the test rig doesn't accidentally expose itself
    # on a network. The test client connects via the host port.
    ports:
      - "127.0.0.1:33306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: weir_test
    volumes:
      # Auto-runs every *.sql / *.sh in alphabetic order on first start.
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/00-weir-records.sql:ro
    healthcheck:
      # `mysqladmin ping` over the local socket: succeeds once the server
      # is accepting connections AND the init script has finished
      # (the entrypoint blocks the server's TCP listener until init
      # is done, so a successful ping implies the schema is ready).
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptest"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres:
    image: postgres:16
    container_name: weir-test-postgres
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: weir_test
    volumes:
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/00-weir-records.sql:ro
    healthcheck:
      # `pg_isready` returns 0 once postgres is accepting connections.
      # The postgres image's init-script lifecycle also gates the
      # external TCP listener on init completion, same story as mysql.
      test: ["CMD-SHELL", "pg_isready -U postgres -d weir_test"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: weir-test-clickhouse
    ports:
      - "127.0.0.1:18123:8123"
    volumes:
      - ./init-clickhouse.sql:/docker-entrypoint-initdb.d/00-weir-records.sql:ro
    healthcheck:
      # /ping returns "Ok." once the HTTP interface is up. The init SQL runs
      # before the server reports ready, so a healthy status implies the
      # weir_records table exists.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  minio:
    # WHY `bitnamilegacy` AND NOT `quay.io/minio/minio`. MinIO withdrew its
    # public images: every tag on quay.io/minio/{minio,mc} now answers
    # `401 UNAUTHORIZED` to an anonymous pull -- including the release this file
    # used to pin -- and `docker.io/minio/minio` returns `object not found`. The
    # `sink integration` job failed in 12 s on every PR as a result, before
    # running one test. Bitnami's archive is the same MinIO server, so the suite
    # keeps the power it had; that matters here more than usual, because these
    # tests are what hold weir's HAND-ROLLED SigV4 to account, and swapping in an
    # S3 mock that does not verify signatures would leave the job green while
    # testing nothing. Verified, not assumed: this image answers a deliberately
    # bad signature with `SignatureDoesNotMatch` (not merely 403), and all five
    # `s3_sink` tests pass against it unchanged.
    #
    # `bitnamilegacy` is frozen and receives no updates. Acceptable for a
    # CI-only rig that binds to loopback and holds no real data; it would not be
    # acceptable in a deployment. If it is ever withdrawn too, the replacement
    # must be held to the same bar -- enforce SigV4, pass all five tests -- and
    # `adobe/s3mock` fails the first of those.
    #
    # Pinned by tag like the other services here. Production deployments should
    # pin by digest; this is a test rig.
    image: docker.io/bitnamilegacy/minio:2025.7.23
    container_name: weir-test-minio
    # No `command:`. Bitnami's entrypoint runs `minio server` against its own
    # data directory; overriding it with the upstream image's
    # `server /data --console-address` fights that for no gain, since only 9000
    # is published and the console is never used.
    ports:
      # 127.0.0.1-only, same as the SQL services: the rig must never be
      # reachable off-host.
      - "127.0.0.1:19000:9000"
    environment:
      MINIO_ROOT_USER: weirtest
      MINIO_ROOT_PASSWORD: weirtestsecret
    healthcheck:
      # MinIO's own liveness probe. Healthy implies the S3 API is bound.
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  minio-init:
    image: docker.io/bitnamilegacy/minio-client:2025.7.21
    container_name: weir-test-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # Two buckets. `weir-test` is the ordinary target. `weir-test-restricted`
    # exists for the least-privilege test: a policy granting PutObject but not
    # ListBucket makes HeadBucket 403 while writes still succeed, which is the
    # case the sink maps to Degraded rather than Down.
    # The alias set RETRIES, and that is not defensive padding. Bitnami's
    # entrypoint starts MinIO, configures `mc` against it, then STOPS it and
    # starts it again -- the upstream image started once. `depends_on:
    # service_healthy` can therefore be satisfied by the first, throwaway
    # instance, and this container gets released into the ~100 ms window where
    # nothing is listening. Observed exactly once as `dial tcp ...:9000:
    # connect: connection refused`, which left the anonymous-download policy
    # unset and failed four of the five s3_sink tests in the LIST helper -- a
    # 403 with no hint that the cause was a startup race. Retrying removes the
    # race whatever the server does, which a longer `start_period` would only
    # make less likely.
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 60); do
        mc alias set local http://minio:9000 weirtest weirtestsecret && break;
        echo \"minio not serving yet, retrying ($$i/60)\"; sleep 1;
      done &&
      mc mb --ignore-existing local/weir-test &&
      mc mb --ignore-existing local/weir-test-restricted &&
      mc anonymous set download local/weir-test &&
      echo minio-init done
      "
