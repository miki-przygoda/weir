[package]
name = "weir-status"
description = "Status model, Conditions evaluator and probe predicates for the weir daemon's health and readiness checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["health-check", "readiness", "status", "monitoring", "probe"]
categories = ["development-tools::debugging"]

[dependencies]
# The status document is a serde type that both the daemon and weir-ctl must
# (de)serialise identically. serde is already in the lock tree (weir-server's
# config parsing). No I/O, no clock, no tokio: `now` is always passed in.
serde = { version = "1", features = ["derive"] }
# The admin protocol envelope (`admin.rs`) carries `id`, `args` and `result`
# as `serde_json::Value`. Already in the lock tree.
serde_json = "1"
