[package]
name = "weir-ctl"
description = "Admin CLI for the weir write buffer daemon: status, dead-letter and quarantine requeue, WAB inspection, attestation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["write-ahead-log", "dead-letter", "admin", "cli", "operations"]
categories = ["command-line-utilities", "database", "development-tools::debugging"]

[[bin]]
name = "weir-ctl"
path = "src/main.rs"

[dependencies]
weir-core = { workspace = true }
weir-client = { workspace = true }
# Shared on-disk WAB segment reader — lets `dl requeue` read dead-letter
# segments using the SAME parser the daemon uses, without pulling in the
# daemon's async/sink dep tree.
weir-wab = { workspace = true }
# The chain lives in its own crate so the daemon's ack path never pays for it;
# weir-ctl is where an operator drives it from.
weir-attest = { workspace = true }
# clap with derive for the subcommand surface + env for the WEIR_WAB_DIR
# fallback on --wab-dir. The proc-macro build cost is already paid elsewhere in
# the workspace (serde derive, etc.).
clap = { version = "4", features = ["derive", "env"] }
# Machine-readable `--json` output for the read/inspect subcommands. weir-ctl is
# a binary (no public API), so the runtime dep cost is fine; serde_json is
# already in the workspace lock tree as a transitive dep.
serde_json = "1"
# The shared evaluator, status types and admin protocol helpers (spec §5.1);
# weir-ctl must evaluate offline without depending on weir-server.
weir-status = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Peer credentials of the admin socket (SO_PEERCRED / getpeereid) and geteuid,
# for the client-side identity check (spec §11). std's UnixStream::peer_cred is
# still unstable at MSRV 1.88; libc is already in the lock tree via weir-server.
libc = "0.2"

[dev-dependencies]
# Test-only: the requeue tests hand-build dead-letter segment fixtures and need
# to compute the per-record CRC32 that SegmentReader verifies. Same crate +
# algorithm weir-wab uses internally.
crc32fast = "1.4"
