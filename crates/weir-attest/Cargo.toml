[package]
name = "weir-attest"
description = "Tamper-evident hash chain over sealed weir WAB segments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tamper-evident", "hash-chain", "audit-log", "integrity", "audit"]
categories = ["cryptography", "filesystem"]

[dependencies]
weir-wab = { workspace = true }
# RecordId is the chain's input: RecordId::for_record over the segment's
# file-name identity `<shard>/<segment>` and the record index. It is not the id
# weir delivers to sinks, which since the RecordId change adds
# `@<created_at hex>`, so a head cannot be recomputed from a downstream's
# id_column values or Idempotency-Keys. Chaining over the delivered id is
# planned in the attest-disposal-log epic (docs/superpowers/temper/epics.md).
weir-sink-sdk = { workspace = true }
sha2 = "0.10"
crc32fast = "1.4"

[dev-dependencies]
# TEST-ONLY, matching weir-core's tests/conformance_batch.rs: loads the
# frozen chain vectors (docs/conformance/attest_v1_vectors.json), parsed via
# serde_json::Value with no derive, so no proc-macro build deps are pulled.
# Does not touch the crate's runtime/published surface.
serde_json = "1"
