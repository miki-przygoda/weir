# 8-hour Phase 1 soak with WAB FORMAT V2 (zstd) — random kill -9 only.
#
# WHY THIS SCHEDULE EXISTS. The 10h and 5h soaks on bare metal put 38.6M acked
# records through weir across 665 crashes with zero violations — but every one
# of those records was written at on-disk format v1. `wab_compression` defaults
# to "none", the harness never overrode it, and "none" means segments are
# byte-identical to weir 1.x. So weir 2.0's WAB v2 work has, to date, ZERO
# coverage from the chaos harness: not the v2 write path, and more importantly
# not v2 RECOVERY — truncating a torn tail out of a compressed segment.
#
# weir's own config documentation calls enabling compression a ONE-WAY DOOR: a
# 1.x daemon refuses to read a v2 segment. That makes it simultaneously the
# highest-risk change in 2.0 and, until this run, the least tested.
#
# WHAT THIS VENUE CAN AND CANNOT SAY. This runs in a privileged container on
# Docker Desktop, so storage is virtualised: NO NUMBER WITH A UNIT ATTACHED
# MEANS ANYTHING HERE. Do not quote throughput, latency, or bytes-per-second
# from this run. What it CAN say is everything binary: whether I1/I2 hold,
# whether recovery truncates a compressed tail correctly, whether anything is
# quarantined, whether the daemon ever fails to restart. Those verdicts do not
# care that the disk is virtual, because the injected fault is a process kill —
# `kill -9` does not lose the page cache, so the torn-tail recovery path
# reproduces faithfully. Power loss is what needs real hardware, and this is
# not that (see ../../docs/benchmarks/chaos-phase2/).
#
# Container note: Docker Desktop on Apple Silicon runs arm64 Linux natively, so
# this is also the project's first sustained run on aarch64-unknown-linux-gnu.

# Distinct from soak10h (0xB0A75) and soak5h (0x5A0C5): run_id derives from the
# seed, so reusing one collides with that run's directory, and an independent
# kill sequence makes this a fresh sample rather than a replay.
seed = 0x2B5D0

# A ceiling, not the bound — max_duration_secs is what stops the run. Bare metal
# managed ~82s/episode; virtualised storage here will be slower, so 8h is
# unlikely to reach 400. Generous on purpose: the episode count must never be
# what ends the run, or the soak silently becomes shorter than it claims.
episodes = 400

# 8 hours, stopped cleanly BETWEEN episodes so the final pass still runs, the
# report is still written, and the loop device and mount are still torn down.
# An external timeout would kill mid-episode and strand both.
max_duration_secs = 28800

steady_lo_secs = 45.0
steady_hi_secs = 90.0
quiescence_timeout_secs = 120.0

[load]
threads = 8
record_size = 256
# Sync, matching both bare-metal soaks. Holding the tier fixed is what makes
# "v1 passed, v2 also passed" a comparison rather than two unrelated runs.
tier = "S"
min_acked_per_episode = 100
min_delivered_per_episode = 100

[weir]
shard_count = 4
batch_size = 64
batch_deadline_ms = 2
wab_segment_max_bytes = 8388608

# THE POINT OF THIS RUN. Everything above is deliberately identical to
# soak5h.toml; these two lines are the entire difference.
wab_compression = "zstd"
# zstd's own default. The valid range is 1..=19, but a higher level would only
# spend CPU this venue cannot measure meaningfully anyway — and the thing under
# test is the FORMAT and its recovery path, not the compression ratio.
wab_compression_level = 3

[storage]
# 2 GiB, as on bare metal. Compression means segments hold more records per
# byte, so if anything this is roomier than the v1 runs — a transient drain
# stall is even less likely to reach ENOSPC, which is a Phase 3 fault and would
# produce an anomaly that says nothing about what this run is for.
size_mb = 2048

# Empty: this is Phase 1. dm-flakey injection is still unimplemented.
[faults]
