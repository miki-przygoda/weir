# Power loss against the Buffered tier. THE POINT of Phase 2.
#
# Buffered acks after the in-memory write, before any fsync, so power loss may
# legitimately eat an acked record. That is its documented contract and no run
# has ever measured how much. This one does.
#
# A result of zero loss across every episode is INCONCLUSIVE, not green — see
# report.powerloss_verdict(). It means the injector probably never bit.
# ---------------------------------------------------------------------------
# LENGTH IS BOUNDED BY TIME, NOT BY `episodes`.
#
# `episodes` is a CEILING, deliberately set well above what the time budget can
# reach — episode duration varies with quiescence and restart, so no fixed
# count lands on a target length. Both were previously `episodes = 200` with a
# 7200s cap, which cannot happen: at ~75s/episode the cap stopped the run at
# ~96, so the schedule promised a 200-episode run and delivered half that.
#
# Measured on beast 2026-08-28, from the calibration runs:
#   power-loss overhead   ~45 s/episode (umount + remount + journal replay +
#                         daemon restart + drain quiescence). kill_random pays
#                         almost none of this — do not reuse Phase 1 timings.
#   throughput            ~72,000 records/s (4 usable cores; isolcpus reserves
#                         the other 12)
#   log growth            58.2 B/record across ledger.log + delivered.log
#
# STEADY STATE IS SHORT ON PURPOSE. What is at risk when the machine dies is
# bounded by WRITEBACK LAG — about a second of dirty pages, ~72k records — not
# by how long the episode ran. A 40s steady state exposes the same data to the
# fault as an 8s one; it just writes 5x the ledger. So a short steady state
# buys MORE KILLS PER HOUR at LESS DISK COST with no loss of test power, and
# kills are what a rare-event search actually needs.
#
# Disk is the binding constraint, not memory: beast has ~171 GB free on the
# only Linux filesystem, and the two ledgers ARE the oracle (I1/I2 are
# set-containment checks over exactly them) so they can never be trimmed to
# save space. At 58.2 B/record a 24h run costs ~74 GB. Running under
# `taskset -c 0-15` triples throughput and would cost ~221 GB, which does NOT
# fit — that is why these run on the default 4-core affinity, which is also
# the operating point the injector was calibrated at.
# ---------------------------------------------------------------------------

seed = 0x9F1A1
episodes = 600
max_duration_secs = 21600  # 6h
steady_lo_secs = 8.0
steady_hi_secs = 15.0
quiescence_timeout_secs = 180.0

[load]
threads = 8
record_size = 256
tier = "U"
min_acked_per_episode = 100
# Phase 1's floor of 100 assumes nothing is lost, which is the opposite of
# what this run expects: Buffered acks are meant to go missing here. A floor
# that high would flag every episode that behaves exactly as documented as
# "no progress".
min_delivered_per_episode = 1

[weir]
shard_count = 4
batch_size = 64
batch_deadline_ms = 2
wab_segment_max_bytes = 8388608

[storage]
size_mb = 2048
# The real fault, not the pass-through stand-in. `load_schedule()` refuses
# `dm_target = "linear"` paired with `fault.kind = "power_loss"` for exactly
# this reason: linear injects nothing, so that combination would report green
# having tested no power loss at all.
dm_target = "flakey"

[faults]
kind = "power_loss"
